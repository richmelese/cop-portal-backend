services:
  postgres:
    image: postgres:16-alpine
    container_name: cop-landing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cop
      POSTGRES_PASSWORD: cop_dev_password
      POSTGRES_DB: cop_landing
    ports:
      - "5436:5432"
    volumes:
      - cop_postgres_data:/var/lib/postgresql/data

volumes:
  cop_postgres_data:
